<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelloGov · Customer Support Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#00A0AC; --brand-600:#008C97; --brand-700:#00727B;
  --tint:#E6F6F7; --tint-2:#F2FBFB;
  --ink:#0E2A32; --ink-2:#4B6873; --ink-3:#88A0A8;
  --line:#E2EAEC; --line-2:#EDF2F3;
  --bg:#F6F9F9; --surface:#FFFFFF; --surface-2:#FAFCFC;
  --ok:#0F7B4F; --ok-tint:#E8F5EE;
  --note:#9A6B10; --note-tint:#FBF3E2;
  --danger:#B4342C; --danger-tint:#FBECEA;
  --shadow:0 1px 2px rgba(14,42,50,.04), 0 8px 24px rgba(14,42,50,.05);
  --shadow-lg:0 2px 8px rgba(14,42,50,.06), 0 24px 60px rgba(14,42,50,.13);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --brand:#2BBFCA; --brand-600:#46CDD7; --brand-700:#7FDDE4;
  --tint:#0E2A2E; --tint-2:#0C2226;
  --ink:#E8F0F1; --ink-2:#9DB4BB; --ink-3:#6E888F;
  --line:#22343A; --line-2:#1B2A2F;
  --bg:#0B1417; --surface:#111D21; --surface-2:#0F1A1E;
  --ok:#54C08C; --ok-tint:#0F2A22;
  --note:#D9AE5A; --note-tint:#2A2316;
  --danger:#E08279; --danger-tint:#2C1917;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 2px 8px rgba(0,0,0,.35), 0 24px 60px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-feature-settings:'ss01';
}
h1,h2,h3,h4{margin:0;letter-spacing:-.022em;font-weight:800;line-height:1.14}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{
  background:var(--surface);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:26px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{display:flex;align-items:center;gap:9px;padding:0 8px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo .mark{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.navlabel{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:0 10px;margin-bottom:7px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;padding:9px 10px;border-radius:9px;
  font-size:14.5px;font-weight:600;color:var(--ink-2);transition:background .14s,color .14s;
}
.navitem:hover{background:var(--line-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--tint);color:var(--brand-700)}
.navitem .ico{width:18px;height:18px;flex:none;display:grid;place-items:center}
.navitem .sub{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3)}
.navitem.locked{color:var(--ink-3)}
.sidefoot{margin-top:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;font-size:13px;color:var(--ink-2)}
.sidefoot b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:3px}

.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:12px 30px;
}
.search{flex:1;max-width:470px;position:relative}
.search input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px 9px 36px;font-size:14px;
}
.search input::placeholder{color:var(--ink-3)}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:grid}
.sresults{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:40;max-height:340px;overflow:auto;
}
.sresults button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 11px;border-radius:8px;font-size:14px}
.sresults button:hover{background:var(--line-2)}
.sresults .m{font-size:12px;color:var(--ink-3);font-weight:600}
.sresults .empty{padding:12px;font-size:13.5px;color:var(--ink-2)}

.modesw{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.modesw button{background:none;border:none;padding:6px 13px;border-radius:7px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.modesw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--brand-700);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}

main{padding:36px 30px 90px;max-width:1020px}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:12px 16px}
  .side .navlabel,.sidefoot{display:none}
  .nav{flex-direction:row}
  .navitem{white-space:nowrap}
  main{padding:24px 18px 80px}
  .topbar{padding:10px 18px}
}

/* ============ PRIMITIVES ============ */
.eyebrow{font-size:12.5px;font-weight:700;color:var(--brand-700);margin-bottom:7px}
.h1{font-size:clamp(30px,4vw,40px)}
.lede{color:var(--ink-2);font-size:16px;margin:9px 0 0;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.pill.brand{background:var(--tint);color:var(--brand-700)}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.sample{background:var(--note-tint);color:var(--note)}
.pill.tbd{background:var(--line-2);color:var(--ink-3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--brand);color:#fff;border:1px solid transparent;border-radius:10px;
  padding:10px 17px;font-size:14.5px;font-weight:700;transition:background .14s,transform .1s;
}
.btn:hover{background:var(--brand-600)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:8px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--danger)}
.btn.danger:hover{background:var(--danger-tint)}
.bar{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1)}
.bar.ok i{background:var(--ok)}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3)}
.sectitle{font-size:13px;font-weight:700;color:var(--ink-3);margin:0 0 12px}

/* ============ JOURNEY TIMELINE ============ */
.journey{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 0 2px}
.jstep{flex:1;min-width:112px;background:none;border:none;padding:0;text-align:center;position:relative}
.jstep .track{position:absolute;top:13px;height:2px;background:var(--line);left:50%;right:-50%;z-index:0}
.jstep.done .track{background:var(--ok)}
.jstep:last-child .track{display:none}
.jstep .knob{
  position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 9px;
  display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--ink-3);
  transition:transform .16s;
}
.jstep.done .knob{background:var(--ok);border-color:var(--ok);color:#fff}
.jstep.current .knob{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--tint)}
.jstep.current .knob::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.jstep:hover .knob{transform:scale(1.07)}
.jstep .nm{font-size:13.5px;font-weight:700;display:block}
.jstep .st{font-size:12px;color:var(--ink-3);display:block;margin-top:1px}
.jstep.current .nm{color:var(--brand-700)}
.jstep.locked .nm{color:var(--ink-3)}

/* ============ STAT CARDS ============ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0}
@media(max-width:700px){.stats{grid-template-columns:1fr}}
.stat{padding:20px 22px;display:flex;align-items:center;gap:18px}
.ring{width:64px;height:64px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:15px;font-weight:800}
.stat .lbl{font-size:13px;font-weight:700;color:var(--ink-3)}
.stat .val{font-size:15px;font-weight:700;margin-top:1px}
.stat .sub{font-size:13px;color:var(--ink-2)}
.certmini{width:52px;height:52px;border-radius:13px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-3);flex:none}
.certmini.earned{background:var(--tint);color:var(--brand)}

/* ============ DAY HERO ============ */
.dayhero{
  position:relative;overflow:hidden;padding:28px 30px;margin:0 0 22px;
  background:linear-gradient(180deg,var(--tint-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);
}
.dayhero h2{font-size:clamp(24px,3.2vw,32px);margin:9px 0 8px}
.dayhero p{margin:0;color:var(--ink-2);max-width:58ch;font-size:15.5px}
.dayhero .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.dayhero .meta span{display:inline-flex;align-items:center;gap:6px}
.dayart{position:absolute;right:-10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
@media(max-width:820px){.dayart{display:none}}

.progressrow{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.progressrow .t{font-size:14px;font-weight:700;white-space:nowrap}
.progressrow .bar{flex:1}
.progressrow .p{font-size:13.5px;font-weight:700;color:var(--ink-2);width:38px;text-align:right}

/* ============ LEARNING PATH ============ */
.path{position:relative;padding-left:0}
.pitem{position:relative;display:flex;gap:16px;padding-bottom:10px}
.pitem .rail{width:34px;flex:none;display:flex;flex-direction:column;align-items:center}
.pitem .node{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--surface);border:2px solid var(--line);color:var(--ink-3);font-size:12.5px;font-weight:800;
}
.pitem.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.pitem.current .node{border-color:var(--brand);color:var(--brand-700);background:var(--surface);box-shadow:0 0 0 4px var(--tint)}
.pitem.cp .node{border-radius:9px;transform:rotate(45deg)}
.pitem.cp .node > *{transform:rotate(-45deg)}
.pitem .line{flex:1;width:2px;background:var(--line);margin:5px 0 -10px}
.pitem.done .line{background:var(--ok)}
.pitem:last-child .line{display:none}
.pcard{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  transition:border-color .14s, box-shadow .14s, transform .14s;margin-bottom:8px;
}
button.pcard{cursor:pointer}
button.pcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.pitem.current .pcard{border-color:var(--brand);background:var(--tint-2);box-shadow:var(--shadow)}
.pitem.locked .pcard{background:var(--surface-2);border-style:dashed;cursor:default}
.pitem.locked .pcard:hover{border-color:var(--line);box-shadow:none}
.pitem.locked .ptitle,.pitem.locked .pdesc{color:var(--ink-3)}
.pcard .picon{width:36px;height:36px;border-radius:9px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.pitem.current .picon{background:var(--tint);color:var(--brand-700)}
.pitem.cp .pcard{background:var(--surface-2);border-left:3px solid var(--brand)}
.pitem.cp.locked .pcard{border-left-color:var(--line)}
.pbody{flex:1;min-width:0}
.ptitle{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptitle .num{color:var(--ink-3);font-weight:700;font-size:13px}
.pdesc{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.pmeta{display:flex;align-items:center;gap:10px;flex:none;font-size:13px;color:var(--ink-3);font-weight:600}
@media(max-width:640px){.pmeta .est{display:none}}
.lockmsg{font-size:12.5px;color:var(--ink-3)}

/* ============ SETUP CHECKLIST ============ */
.setup{padding:22px 24px;margin-bottom:22px}
.setup h3{font-size:19px;margin-bottom:5px}
.sitem{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.sitem:last-child{border-bottom:none}
.sitem input{width:18px;height:18px;accent-color:var(--brand)}
.sitem.on{color:var(--ink-2)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(9,26,31,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100dvh;width:clamp(460px,42vw,660px);
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  transform:translateX(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:70;
  display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0)}
@media(max-width:700px){
  .drawer{width:100%;border-left:none}
}
@media(prefers-reduced-motion:reduce){.drawer,.scrim,.bar i{transition:none}}
.dhead{padding:22px 28px 0;flex:none}
.dcrumb{font-size:12.5px;font-weight:700;color:var(--brand-700);letter-spacing:.02em}
.dhead h2{font-size:27px;margin:7px 0 9px}
.dmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);font-weight:600}
.dclose{position:absolute;top:18px;right:20px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;color:var(--ink-2)}
.dclose:hover{background:var(--line-2);color:var(--ink)}
.dtabs{display:flex;gap:4px;padding:18px 28px 0;border-bottom:1px solid var(--line);flex:none}
.dtabs button{background:none;border:none;padding:9px 14px;font-size:14px;font-weight:700;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
.dtabs button:hover{color:var(--ink)}
.dtabs button[aria-selected="true"]{color:var(--brand-700);border-bottom-color:var(--brand)}
.dbody{flex:1;overflow-y:auto;padding:24px 28px 30px}
.dfoot{flex:none;padding:16px 28px;border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:14px}
.dfoot .req{font-size:13px;color:var(--ink-3);flex:1}

.learnbox{background:var(--tint-2);border:1px solid var(--line);border-radius:12px;padding:17px 19px;display:flex;gap:14px}
.learnbox .ic{color:var(--brand);flex:none;margin-top:1px}
.learnbox h4{font-size:15px;margin-bottom:4px}
.learnbox p{margin:0;font-size:14.5px;color:var(--ink-2)}
.blk{margin-top:26px}
.blk > h4{font-size:14px;margin-bottom:11px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.method{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:13px 12px;text-align:center}
.method .mi{color:var(--brand);margin-bottom:7px;display:grid;place-items:center}
.method .mt{font-size:13px;font-weight:700;line-height:1.3}

.matlist{display:flex;flex-direction:column;gap:9px}
.mat{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;text-align:left;width:100%}
.mat:hover{border-color:var(--brand)}
.mat .mi{width:36px;height:36px;border-radius:9px;background:var(--line-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.mat.done .mi{background:var(--ok-tint);color:var(--ok)}
.mat .mb{flex:1;min-width:0}
.mat .mn{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mat .md{font-size:13px;color:var(--ink-2);margin-top:1px}
.matview{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.matview .vh{padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.matview .vb{padding:18px;font-size:14.5px;color:var(--ink-2)}
.fakevid{aspect-ratio:16/9;background:linear-gradient(135deg,var(--tint),var(--line-2));display:grid;place-items:center;color:var(--brand-700)}
.fakedoc{background:var(--surface-2);padding:20px;font-size:14px;line-height:1.7}
.fakedoc .ln{height:9px;background:var(--line);border-radius:4px;margin:9px 0}

/* ============ PRACTICE ============ */
.act{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:16px;background:var(--surface)}
.acth{padding:14px 17px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.acth .at{font-size:14.5px;font-weight:700;flex:1;min-width:130px}
.actb{padding:18px}
.instr{font-size:14.5px;color:var(--ink-2);margin:0 0 14px}
.scen{background:var(--tint-2);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:13px 16px;margin:0 0 15px;font-size:14.5px}
.scen b{display:block;font-size:12.5px;color:var(--brand-700);margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;text-align:left;background:var(--surface);width:100%;transition:border-color .14s,background .14s}
.opt:hover{border-color:var(--brand)}
.opt .rd{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;transition:border-color .14s}
.opt.sel .rd,.opt.right .rd,.opt.wrong .rd{border-color:currentColor}
.opt.sel .rd::after,.opt.right .rd::after,.opt.wrong .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.opt.sel{color:var(--brand-700)}.opt.right{color:var(--ok)}.opt.wrong{color:var(--danger)}
.opt.sel{border-color:var(--brand);background:var(--tint-2)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--danger);background:var(--danger-tint)}
.fb{margin-top:14px;border-radius:11px;padding:13px 16px;font-size:14.5px;display:flex;gap:11px}
.fb.good{background:var(--ok-tint);color:var(--ok)}
.fb.bad{background:var(--note-tint);color:var(--note)}
.fb .fi{flex:none;margin-top:1px}
.fb b{display:block;margin-bottom:3px}
.fb p{margin:0;color:inherit;opacity:.92}
.actf{display:flex;align-items:center;gap:11px;margin-top:16px}

.docs{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:15px}
@media(max-width:620px){.docs{grid-template-columns:1fr}}
.docc{border:1px solid var(--line);border-radius:12px;overflow:hidden}

.ordi .oc{display:flex;gap:3px}

.ordi.right{border-color:var(--ok);background:var(--ok-tint)}

.model{background:var(--ok-tint);border-radius:11px;padding:14px 16px;font-size:14.5px;margin-top:13px;white-space:pre-line}
.model b{display:block;color:var(--ok);font-size:12.5px;margin-bottom:5px}

.feed{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.feed .fh{padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2)}

.fev:last-child{border-bottom:none}

.fev .fw{flex:1;min-width:0}

.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--ink-3);font-size:14px}

.qres{text-align:center;padding:14px 0 6px}
.qres .big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1}

.fgrp input[type=text],.fgrp input[type=number],.fgrp textarea,.fgrp select{

}

.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}

.minirow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:14px}
.minirow .mt{flex:1;min-width:0}
.minirow .mn{font-weight:700;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.minirow .ms{font-size:12.5px;color:var(--ink-3)}
.toastwrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .28s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}

const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const S = {
  mode:'learner',          // learner | trainer
  preview:false,           // trainer previewing the draft as a learner
  view:'overview',         // overview | setup | d1.. | cert
  published:null,
  draft:null,
  dirty:false,
  progress:{ mods:{}, mats:{}, acts:{}, cps:{}, setup:{} },
  drawer:null,             // {itemId, dayId, tab}
  quiz:null,
  act:{},                  // transient UI state per activity
  toastId:0
};

function save(){
  try{ localStorage.setItem('hg-learn-v1', JSON.stringify({
    published:S.published, draft:S.draft, dirty:S.dirty, progress:S.progress
  })); }catch(e){}
}
function load(){
  let d=null;
  try{ d = JSON.parse(localStorage.getItem('hg-learn-v1')||'null'); }catch(e){ d=null; }
  if(d && d.published && d.draft){
    S.published=d.published; S.draft=d.draft; S.dirty=!!d.dirty; S.progress=d.progress||S.progress;
  } else {
    S.published = clone(SEED); S.draft = clone(SEED);
    demoProgress();
  }
}
function resetAll(){
  try{ localStorage.removeItem('hg-learn-v1'); }catch(e){}
  S.published = clone(SEED); S.draft = clone(SEED); S.dirty=false;
  S.progress = { mods:{}, mats:{}, acts:{}, cps:{}, setup:{} };
  demoProgress(); S.view='overview'; S.act={}; save(); render();
  toast('Demo state restored');
}
/* Demo state: Day 1 complete, Day 2 in progress, Sydney is current. */
function demoProgress(){
  const p = S.progress;
  S.published.setup.items.forEach(i => p.setup[i.id]=true);
  const d1 = S.published.days[0], d2 = S.published.days[1];
  const finish = it => {
    if(it.kind==='module'){
      (it.materials||[]).forEach(m=>p.mats[m.id]=true);
      (it.activities||[]).forEach(a=>p.acts[a.id]=true);
      p.mods[it.id]=true;
    } else {
      const ans={}; (it.questions||[]).forEach((q,i)=>ans[i]=q.correct);
      p.cps[it.id]={submitted:true, score:(it.questions||[]).length, total:(it.questions||[]).length, answers:ans};
    }
  };
  d1.items.forEach(finish);
  finish(d2.items.find(i=>i.id==='m201'));
  finish(d2.items.find(i=>i.id==='m202'));
}

/* ===================== PROGRAM ACCESS ===================== */
const prog = () => (S.mode==='trainer' || S.preview) ? S.draft : S.published;
const learnerProg = () => S.preview ? S.draft : S.published;
const allItems = p => p.days.flatMap(d => d.items.map(it => ({day:d, item:it})));
const findDay = (p,id) => p.days.find(d=>d.id===id);
const findItem = (p,id) => { for(const d of p.days){ const it=d.items.find(i=>i.id===id); if(it) return {day:d,item:it}; } return null; };
const mods = d => d.items.filter(i=>i.kind==='module');

function estLabel(m){
  if(m.estMin && m.estMax) return 'Est. ~' + fmtMin(m.estMin) + '–' + fmtMin(m.estMax);
  if(m.est) return '~' + fmtMin(m.est);
  return 'Time TBD';
}
function fmtMin(n){ return n>=60 ? (n%60? (n/60).toFixed(1).replace('.0','')+' hr' : (n/60)+' hr') : n+' min'; }
function dayEst(d){
  const ms = mods(d);
  const known = ms.filter(m=>m.est||m.estMin);
  if(!known.length) return 'Estimated duration in progress';
  const lo = known.reduce((a,m)=>a+(m.estMin||m.est),0);
  const hi = known.reduce((a,m)=>a+(m.estMax||m.est),0);
  const missing = ms.length - known.length;
  const base = lo===hi ? 'Est. ~'+fmtMin(lo) : 'Est. ~'+fmtMin(lo)+'–'+fmtMin(hi);
  return base + (missing ? ' + '+missing+' TBD' : '');
}

/* ===================== PROGRESSION ===================== */
function matDone(m){ return !!S.progress.mats[m.id]; }
function actDone(a){ return !!S.progress.acts[a.id]; }
function modReqs(m){
  const r = [...(m.materials||[]).filter(x=>x.requirement==='required'),
             ...(m.activities||[]).filter(x=>x.requirement==='required')];
  return r;
}
function modReady(m){
  return (m.materials||[]).filter(x=>x.requirement==='required').every(matDone)
      && (m.activities||[]).filter(x=>x.requirement==='required').every(actDone);
}
function cpResult(cp){ return S.progress.cps[cp.id]||null; }
function isDone(it){
  if(it.kind==='module') return !!S.progress.mods[it.id];
  const r = cpResult(it); if(!r||!r.submitted) return false;
  const ps = it.settings && it.settings.passingScore;
  if(ps!=null && it.settings.requiredToProgress) return (r.score/Math.max(1,r.total))*100 >= ps;
  return true;
}
/* Status derives purely from configured order — reordering changes progression automatically. */
function states(){
  const p = learnerProg(), out = {}, dayOut = {};
  let blocked = false, currentSet = false;
  for(const d of p.days){
    let dayAll = true;
    for(const it of d.items){
      if(isDone(it)){ out[it.id]='done'; continue; }
      if(it.required!==false) dayAll = false;
      if(blocked){ out[it.id]='locked'; }
      else if(!currentSet){ out[it.id]='current'; currentSet=true; }
      else { out[it.id]='available'; }
      if(it.required!==false) blocked = true;
    }
    dayOut[d.id] = dayAll ? 'done' : (d.items.some(i=>out[i.id]==='current'||out[i.id]==='available') ? 'current' : 'locked');
  }
  if(S.preview){ for(const k in out) if(out[k]==='locked') out[k]='available';
                 for(const k in dayOut) if(dayOut[k]==='locked') dayOut[k]='available'; }
  const allDays = p.days.every(d=>dayOut[d.id]==='done');
  return {item:out, day:dayOut, certUnlocked:allDays || S.preview, certEarned:false};
}
function dayProgress(d){
  const req = d.items.filter(i=>i.required!==false);
  const done = req.filter(isDone).length;
  return {done, total:req.length, pct: req.length? Math.round(done/req.length*100):0};
}
function overallProgress(){
  const p = learnerProg();
  const all = allItems(p).map(x=>x.item).filter(i=>i.required!==false);
  const m = all.filter(i=>i.kind==='module');
  const done = all.filter(isDone).length;
  return {done, total:all.length, pct: all.length?Math.round(done/all.length*100):0,
          modDone:m.filter(isDone).length, modTotal:m.length};
}

/* ===================== UI HELPERS ===================== */
function toast(msg){
  const w = document.getElementById('toasts');
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  w.appendChild(el); setTimeout(()=>el.remove(), 2600);
}
function ring(pct,size,stroke,color){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color||'var(--brand)'}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"/>
    </svg><b>${pct}%</b></div>`;
}
const reqPill = r => r==='required' ? '<span class="pill">Required</span>'
               : r==='optional' ? '<span class="pill">Optional</span>'
               : '<span class="pill">Reference</span>';
const matIcon = t => t==='video'?ico.play():t==='link'?ico.link():t==='slides'?ico.slides():ico.doc();
const methodIcon = m => /roleplay|trainer/i.test(m)?ico.person():/video/i.test(m)?ico.play():
  /listening|call/i.test(m)?ico.ear():/shadow/i.test(m)?ico.eye():/writ/i.test(m)?ico.pen():

function renderNav(){
  const p = learnerProg(), st = states();
  const rows = [
    {id:'overview', label:'Overview', icon:ico.home(), state:'open'},
    {id:'setup', label:'Before Day 1', icon:ico.wrench(), state:'open',
     sub:(p.setup.items.filter(i=>S.progress.setup[i.id]).length)+'/'+p.setup.items.length}
  ];
  p.days.forEach((d,i)=>rows.push({id:d.id, label:'Day '+(i+1), icon:null, state:st.day[d.id], sub:d.short}));
  rows.push({id:'cert', label:'Certification', icon:ico.award(), state: st.certUnlocked?'open':'locked'});

  document.getElementById('nav').innerHTML = rows.map(r=>{
    const locked = r.state==='locked';
    const mark = r.state==='done' ? `<span style="color:var(--ok)">${ico.check(16)}</span>`
      : r.state==='current' ? `<span style="color:var(--brand)">${I('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/>',16)}</span>`
      : locked ? `<span>${ico.lock(15)}</span>` : (r.icon||'');
    return `<button class="navitem ${locked?'locked':''}" data-nav="${r.id}" ${locked?'aria-disabled="true"':''}
      aria-current="${S.view===r.id}"><span class="ico">${mark}</span>${esc(r.label)}
      ${r.sub?`<span class="sub">${esc(r.sub)}</span>`:''}</button>`;
  }).join('');
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.nav, st2=states();
    if(id!=='overview'&&id!=='setup'){
      if(id==='cert' && !st2.certUnlocked) return toast('Complete Days 1 to 4 to unlock certification');
      if(id!=='cert' && st2.day[id]==='locked') return toast('Complete the previous day to unlock');
    }
    S.view=id; render(); window.scrollTo({top:0,behavior:'instant'});
  }));
}

function nestingCard(p){

function viewDay(dayId){
  const p = learnerProg(), d = findDay(p,dayId); if(!d) return viewOverview();
  const st = states(), dp = dayProgress(d), idx = p.days.indexOf(d)+1;
  let n = 0;
  return `
  <div class="dayhero">
    <div class="dayart">${I('<rect x="10" y="14" width="46" height="60" rx="6"/><path d="M20 30h26M20 40h26M20 50h16"/>',96,1.6)}</div>
    <span class="pill brand">Day ${idx}</span>
    <h2>${esc(d.title)}</h2>
    <p>${esc(d.description)}</p>
    <div class="meta">
      <span>${ico.layers()} ${mods(d).length} modules</span>
      <span>${ico.clock()} ${esc(dayEst(d))}</span>
    </div>
  </div>
  <div class="progressrow">
    <span class="t">${dp.done} of ${dp.total} completed</span>
    <span class="bar ${dp.pct===100?'ok':''}"><i style="width:${dp.pct}%"></i></span>
    <span class="p">${dp.pct}%</span>
  </div>
  <div class="path">${d.items.map(it=>{
    const s = st.item[it.id]||'locked';
    const cls = s==='done'?'done':s==='current'?'current':s==='locked'?'locked':'';
    const cp = it.kind==='checkpoint';
    if(!cp) n++;
    const node = s==='done'? ico.check(15) : cp? ico.diamond(13) : `<span>${String(n).padStart(2,'0')}</span>`;
    const tag = cp ? `<span class="pill ${s==='locked'?'tbd':'brand'}">${it.variant==='midday'?'Midday':'End of day'}</span>` : '';
    const right = s==='done' ? `<span class="pill ok">${ico.check(13)} Completed</span>`
      : s==='locked' ? `<span class="pill tbd">${ico.lock(12)} Locked</span>`
      : `<span class="btn sm">${cp?'Start':'Continue'} ${ico.arrow(14)}</span>`;
    const est = it.kind==='module' ? `<span class="est">${esc(estLabel(it))}</span>` : '';
    const inner = `
      <span class="picon">${cp?ico.diamond(16):moduleIcon(it)}</span>
      <span class="pbody">
        <span class="ptitle">${cp?'':`<span class="num">${String(n).padStart(2,'0')}</span>&nbsp;`}${esc(it.title)} ${tag}</span>
        <span class="pdesc">${esc(it.description||'')}</span>
      </span>
      <span class="pmeta">${est}${right}</span>`;
    return `<div class="pitem ${cls} ${cp?'cp':''}">
      <span class="rail"><span class="node">${node}</span><span class="line"></span></span>
      ${s==='locked'
        ? `<div class="pcard" title="Complete the previous module to unlock">${inner}</div>`
        : `<button class="pcard" data-open="${it.id}" data-day="${d.id}">${inner}</button>`}
    </div>`;
  }).join('')}</div>`;
}
function moduleIcon(m){
  const t = (m.title||'').toLowerCase();
  if(/call|flow/.test(t)) return ico.phone(17);
  if(/email/.test(t)) return ico.mail(17);
  if(/platform|tool|chart/.test(t)) return ico.grid(17);
  if(/sydney/.test(t)) return ico.chat(17);
  if(/note|status/.test(t)) return ico.doc(17);
  if(/journey|process/.test(t)) return ico.flag(17);
  if(/vocab|handbook|document/.test(t)) return ico.book(17);
  return ico.target(17);
}

/* ===================== DRAWER ===================== */
function openItem(itemId, dayId){
  const p = learnerProg(); const f = findItem(p,itemId); if(!f) return;
  const st = states();
  if(st.item[itemId]==='locked'){ return toast('Complete the previous module to unlock'); }
  if(f.item.kind==='checkpoint'){
    const prev = cpResult(f.item);
    S.quiz = prev && prev.submitted
      ? {id:itemId, idx:0, answers:{...(prev.answers||{})}, submitted:true, review:false}
      : {id:itemId, idx:0, answers:{}, submitted:false, review:false};
  } else { S.quiz=null; }
  S.drawer = {itemId, dayId:f.day.id, tab:'overview'};
  renderDrawer(); document.getElementById('scrim').classList.add('on');
  const dr=document.getElementById('drawer'); dr.classList.add('on'); dr.setAttribute('aria-hidden','false');
  setTimeout(()=>{ const b=dr.querySelector('.dclose'); if(b) b.focus(); },60);
}
function closeDrawer(){
  S.drawer=null; S.quiz=null;
  document.getElementById('scrim').classList.remove('on');
  const dr=document.getElementById('drawer'); dr.classList.remove('on'); dr.setAttribute('aria-hidden','true');
  render();
}
function renderDrawer(){
  if(!S.drawer) return;
  const p = learnerProg(), f = findItem(p,S.drawer.itemId); if(!f) return closeDrawer();
  const {day,item} = f, dayIdx = p.days.indexOf(day)+1;
  const dr = document.getElementById('drawer');
  if(item.kind==='checkpoint'){ dr.innerHTML = quizHTML(item,day,dayIdx); bindQuiz(item); return; }

  const num = mods(day).indexOf(item)+1;
  const hasMat = (item.materials||[]).length>0, hasAct = (item.activities||[]).length>0;
  const tabs = [['overview','Overview']];
  if(hasMat) tabs.push(['materials','Materials']);
  if(hasAct) tabs.push(['practice','Practice']);
  if(!tabs.find(t=>t[0]===S.drawer.tab)) S.drawer.tab='overview';
  const ready = modReady(item), done = isDone(item);
  const reqs = modReqs(item), left = reqs.filter(r=> r.type? !matDone(r) : !actDone(r)).length;

  dr.innerHTML = `
  <div class="dhead">
    <button class="dclose" aria-label="Close lesson">${ico.x(16)}</button>
    <div class="dcrumb">Day ${dayIdx} · Module ${String(num).padStart(2,'0')}</div>
    <h2 id="dTitle">${esc(item.title)}</h2>
    <div class="dmeta">
      <span>${ico.clock(14)} ${esc(estLabel(item))}</span>
      ${(item.methods||[]).length?`<span>·</span><span>${esc(item.methods.join(' + '))}</span>`:''}
      ${done?'<span class="pill ok">'+ico.check(12)+' Completed</span>':''}
    </div>
  </div>
  <div class="dtabs" role="tablist">${tabs.map(t=>
    `<button role="tab" data-tab="${t[0]}" aria-selected="${S.drawer.tab===t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="dbody">${
    S.drawer.tab==='overview' ? tabOverview(item) :
    S.drawer.tab==='materials' ? tabMaterials(item) : tabPractice(item)
  }</div>
  <div class="dfoot">
    <span class="req">${done?'Completed. You can revisit this module any time.'
      : left? left+' required item'+(left>1?'s':'')+' remaining'
      : 'All required items done'}</span>
    <button class="btn" id="cc" ${(!ready||done)?'disabled':''}>${done?'Completed':'Complete & Continue'}</button>
  </div>`;
  bindDrawer(item, day);
}
function tabOverview(m){
  return `
  <div class="learnbox"><span class="ic">${ico.target(20)}</span>
    <div><h4>What you'll learn</h4><p>${esc(m.objective||m.description||'')}</p></div></div>
  ${(m.concepts||[]).length?`<div class="blk"><h4>Key concepts</h4>
    <div class="tags">${m.concepts.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div></div>`:''}
  ${(m.methods||[]).length?`<div class="blk"><h4>Suggested learning method</h4>
    <div class="methods">${m.methods.map(x=>`<div class="method"><div class="mi">${methodIcon(x)}</div><div class="mt">${esc(x)}</div></div>`).join('')}</div>
    <p class="tiny" style="margin-top:9px">Provisional. Instructional design is still being finalised.</p></div>`:''}
  ${m.note?`<div class="blk"><h4>How this module runs</h4>
    <div class="matview"><div class="vb">${esc(m.note)}</div></div></div>`:''}`;
}
function tabMaterials(m){
  const list = m.materials||[];
  if(!list.length) return `<div class="empty"><b>No materials yet</b>Materials for this module are in development.</div>`;
  return `<div class="matlist">${list.map(r=>{

          ${r.sample?'<span class="pill sample">Demo resource</span>':''}
          ${r.pending?'<span class="pill tbd">In preparation</span>':''}

      ${open?matView(r):''}

}
function matView(r){
  let body='';
  if(r.type==='video') body = `<div class="fakevid">${ico.play(40)}</div>
    <div class="vb">Sample video placeholder. The real recording will be added here.</div>`;
  else if(r.type==='link') body = `<div class="vb">Opens in a new tab.<br><a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:var(--brand-700);font-weight:700">${esc(r.url)}</a>
    <p class="tiny" style="margin-top:10px">Opening a link does not complete the module on its own.</p></div>`;
  else if(r.pending) body = `<div class="vb"><b>Content in development.</b><br>This document has not been written yet. It is listed so the structure is visible.</div>`;
  else body = `<div class="fakedoc"><div class="ln" style="width:62%"></div><div class="ln"></div><div class="ln"></div><div class="ln" style="width:78%"></div>
    <p class="tiny" style="margin-top:14px">Sample document preview for UX demonstration.</p></div>`;
  return `<div class="matview">
    <div class="vh">${matIcon(r.type)} ${esc(r.title)}</div>${body}
    <div class="vb" style="border-top:1px solid var(--line);display:flex;gap:10px;align-items:center">
      <button class="btn sm ${matDone(r)?'ghost':''}" data-matdone="${r.id}">${matDone(r)?'Marked reviewed':'Mark as reviewed'}</button>
      ${r.url?`<a class="btn sm ghost" href="${esc(r.url)}" target="_blank" rel="noopener">Open ${ico.link(14)}</a>`:''}

function tabPractice(m){
  const list = m.activities||[];
  if(!list.length) return `<div class="empty"><b>Practice activity in development</b>This module does not have a practice activity configured yet.</div>`;
  return list.map(a=>renderAct(a)).join('');
}

/* ---------- activities ---------- */
function renderAct(a){
  const s = S.act[a.id] || {};
  const head = `<div class="acth">
      <span class="at">${esc(a.title)}</span>
      ${reqPill(a.requirement)}
      ${a.sample?'<span class="pill sample">Sample exercise</span>':''}
      ${actDone(a)?'<span class="pill ok">'+ico.check(12)+' Done</span>':''}
    </div>`;
  const instr = a.instructions?`<p class="instr">${esc(a.instructions)}</p>`:'';
  const scen = a.scenario?`<div class="scen"><b>Scenario</b>${esc(a.scenario)}</div>`:'';
  let body='';

  if(a.type==='mcq'||a.type==='scenario'){
    body = instr + scen + optionsHTML(a,s) + feedbackHTML(a,s) + checkBtn(a,s);
  }
  else if(a.type==='compare'){
    body = instr + scen + `<div class="docs">${a.docs.map(d=>`
      <div class="docc"><div class="dh">${esc(d.label)}</div>
        <div class="docp ${d.quality==='bad'?'blur':''}">
          <div class="row"><span class="sq"></span><span class="txt"></span></div>
          <div class="txt"></div><div class="txt s"></div><div class="txt"></div>
        </div>
        <div class="vb" style="padding:11px 13px;font-size:13px">${esc(d.caption)}</div>
      </div>`).join('')}</div>` + optionsHTML(a,s) + feedbackHTML(a,s) + checkBtn(a,s);
  }
  else if(a.type==='account'){
    body = instr + `<div class="acct">${Object.entries(a.account).map(([k,v])=>
      `<div><div class="k">${esc(k.replace(/^\w/,c=>c.toUpperCase()))}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
      <div class="feed"><div class="fh">Customer activity — fictional sample account</div>
      ${a.feed.map(f=>`<div class="fev ${f.sydney?'sydney':''}">
        <span class="fa">${f.sydney?ico.chat(15):f.who==='Agent'?ico.person(15):ico.person(15)}</span>
        <span class="fw"><span class="fn">${esc(f.who)} <span class="ft">${esc(f.time)}</span></span>
        <span class="fx">${esc(f.text)}</span></span></div>`).join('')}</div>
      <p class="qq" style="font-size:15.5px;margin:16px 0 12px">${esc(a.question)}</p>`
      + optionsHTML(a,s) + feedbackHTML(a,s) + checkBtn(a,s);
  }
  else if(a.type==='callreview'){
    body = instr + `<div class="feed"><div class="fh">Sample interaction — written stand-in for the recording</div>
      ${a.transcript.map(t=>`<div class="fev"><span class="fa">${t.who==='Agent'?ico.person(15):ico.chat(15)}</span>
      <span class="fw"><span class="fn">${esc(t.who)}</span><span class="fx">${esc(t.text)}</span></span></div>`).join('')}</div>
      <div class="blk"><h4>While you read, listen for</h4><div class="tags">${a.checklist.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div></div>
      <p class="qq" style="font-size:15.5px;margin:18px 0 12px">${esc(a.question)}</p>`
      + optionsHTML(a,s) + feedbackHTML(a,s) + checkBtn(a,s);
  }
  else if(a.type==='match'){
    const pool = s.pool || (s.pool = shuffled(a.pairs.map((p,i)=>i)));
    body = instr + `<div class="pairs">
      <div class="pcol">${a.pairs.map((p,i)=>`<button class="pbtn ${s.done&&s.done[i]?'matched':''} ${s.sel===i?'sel':''}" data-ml="${a.id}:${i}" ${s.done&&s.done[i]?'disabled':''}>${esc(p.l)}</button>`).join('')}</div>
      <div class="pcol">${pool.map(i=>`<button class="pbtn ${s.done&&s.done[i]?'matched':''} ${s.miss===i?'miss':''}" data-mr="${a.id}:${i}" ${s.done&&s.done[i]?'disabled':''}>${esc(a.pairs[i].r)}</button>`).join('')}</div>
    </div>` + (s.complete?`<div class="fb good"><span class="fi">${ico.check(16)}</span><div><b>All pairs matched</b><p>Nice. You can move on.</p></div></div>`:'')
      + (s.complete?markBtn(a):'');
  }
  else if(a.type==='order'){
    const order = s.order || (s.order = shuffled(a.steps.map((x,i)=>i)));
    body = instr + `<div class="ord">${order.map((si,pos)=>{
      const cls = s.checked ? (order[pos]===pos?'right':'wrong') : '';
      return `<div class="ordi ${cls}"><span class="on">${pos+1}</span><span class="ot">${esc(a.steps[si])}</span>
        <span class="oc">
          <button data-mv="${a.id}:${pos}:-1" ${pos===0?'disabled':''} aria-label="Move up">${ico.up(14)}</button>
          <button data-mv="${a.id}:${pos}:1" ${pos===order.length-1?'disabled':''} aria-label="Move down">${ico.down(14)}</button>
        </span></div>`; }).join('')}</div>`
      + (s.checked?feedbackHTML(a,{...s, correct: order.every((v,i)=>v===i)}):'')
      + `<div class="actf"><button class="btn sm" data-ordcheck="${a.id}">Check order</button>
         ${s.checked&&order.every((v,i)=>v===i)?markBtn(a,true):''}</div>`;
  }
  else if(a.type==='written'){
    body = instr + scen + `<textarea class="ta" data-wr="${a.id}" placeholder="Write your answer...">${esc(s.text||'')}</textarea>
      <div class="actf"><button class="btn sm ghost" data-model="${a.id}">${s.model?'Hide example':'Compare with example'}</button>
      ${markBtn(a,true)}</div>
      ${s.model?`<div class="model"><b>Sample answer</b>${esc(a.model)}</div>`:''}
      <p class="tiny" style="margin-top:10px">Written answers are not automatically graded in this prototype.</p>`;
  }
  else if(a.type==='roleplay'){
    body = `<div class="tlead"><span class="ti">${ico.person(16)}</span>
      <div>Trainer-led activity. This happens away from the screen; the platform only records that it was done.</div></div>`
      + instr + scen
      + `<div class="blk"><h4>Agent goal</h4><p class="instr" style="margin:0">${esc(a.goal)}</p></div>
         <div class="blk"><h4>Skills to practice</h4><div class="tags">${a.skills.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></div>
         <div class="actf">${actDone(a)?'<span class="pill ok">'+ico.check(12)+' Completed</span>':'<span class="pill tbd">Awaiting completion</span>'}
         ${markBtn(a,true)}</div>`;
  }
  else if(a.type==='shadow'){
    const ck = s.ck||{};
    body = `<div class="tlead"><span class="ti">${ico.eye(16)}</span>
      <div>Observation activity. Tick each stage as you hear it in the live interaction.</div></div>`
      + instr + `<div class="chk">${a.checklist.map((c,i)=>`
        <label class="chki"><input type="checkbox" data-ck="${a.id}:${i}" ${ck[i]?'checked':''}> ${esc(c)}</label>`).join('')}</div>
      <div class="actf">${markBtn(a,true)}</div>`;
  }
  else body = `<div class="empty"><b>Activity type not configured</b>${esc(a.type)}</div>`;

  return `<div class="act">${head}<div class="actb">${body}</div></div>`;
}
function optionsHTML(a,s){
  return `<div class="opts">${a.options.map((o,i)=>{
    let cls = s.sel===i?'sel':'';
    if(s.checked){ if(i===a.correct) cls='right'; else if(s.sel===i) cls='wrong'; }
    return `<button class="opt ${cls}" data-opt="${a.id}:${i}" ${s.checked?'disabled':''}>
      <span class="rd"></span><span style="color:var(--ink)">${esc(o)}</span></button>`;
  }).join('')}</div>`;
}
function feedbackHTML(a,s){
  if(!s.checked) return '';
  const ok = s.correct!=null ? s.correct : s.sel===a.correct;
  return `<div class="fb ${ok?'good':'bad'}"><span class="fi">${ok?ico.check(16):ico.info(16)}</span>
    <div><b>${ok?'Correct':'Not quite'}</b><p>${esc(a.explain||'')}</p></div></div>`;
}
function checkBtn(a,s){
  if(s.checked) return `<div class="actf">${actDone(a)?'<span class="pill ok">'+ico.check(12)+' Recorded</span>':markBtn(a,true)}
    <button class="btn sm ghost" data-retry="${a.id}">Try again</button></div>`;
  return `<div class="actf"><button class="btn sm" data-check="${a.id}" ${s.sel==null?'disabled':''}>Check answer</button></div>`;
}
function markBtn(a,inline){
  return actDone(a) ? `<button class="btn sm ghost" data-unmark="${a.id}">Completed ${ico.check(13)}</button>`
    : `<button class="btn sm ${inline?'':''}" data-mark="${a.id}">Mark complete</button>`;
}
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.every((v,i)=>v===i)&&a.length>1?shuffled(arr):a; }

function bindDrawer(item, day){
  const dr = document.getElementById('drawer');
  dr.querySelector('.dclose').addEventListener('click', closeDrawer);
  dr.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ S.drawer.tab=b.dataset.tab; renderDrawer(); }));
  dr.querySelectorAll('[data-mat]').forEach(b=>b.addEventListener('click',()=>{
    const k='open_'+b.dataset.mat; S.act[k]=!S.act[k]; renderDrawer(); }));
  dr.querySelectorAll('[data-matdone]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.matdone; S.progress.mats[id]=!S.progress.mats[id]; save(); renderDrawer(); }));
  dr.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{
    const [id,i]=b.dataset.opt.split(':'); S.act[id]={...(S.act[id]||{}), sel:+i}; renderDrawer(); }));
  dr.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.check, a=findAct(item,id); const s=S.act[id]||{};
    S.act[id]={...s, checked:true, correct: s.sel===a.correct};
    if(s.sel===a.correct) S.progress.acts[id]=true;
    save(); renderDrawer(); }));
  dr.querySelectorAll('[data-retry]').forEach(b=>b.addEventListener('click',()=>{
    S.act[b.dataset.retry]={}; renderDrawer(); }));
  dr.querySelectorAll('[data-mark]').forEach(b=>b.addEventListener('click',()=>{
    S.progress.acts[b.dataset.mark]=true; save(); renderDrawer(); }));
  dr.querySelectorAll('[data-unmark]').forEach(b=>b.addEventListener('click',()=>{
    delete S.progress.acts[b.dataset.unmark]; save(); renderDrawer(); }));
  dr.querySelectorAll('[data-model]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.model; S.act[id]={...(S.act[id]||{}), model:!(S.act[id]||{}).model}; renderDrawer(); }));
  dr.querySelectorAll('[data-wr]').forEach(t=>t.addEventListener('input',()=>{
    S.act[t.dataset.wr]={...(S.act[t.dataset.wr]||{}), text:t.value}; }));
  dr.querySelectorAll('[data-ck]').forEach(c=>c.addEventListener('change',()=>{
    const [id,i]=c.dataset.ck.split(':'); const s=S.act[id]||{}; s.ck={...(s.ck||{}), [i]:c.checked}; S.act[id]=s; }));
  dr.querySelectorAll('[data-ml]').forEach(b=>b.addEventListener('click',()=>{
    const [id,i]=b.dataset.ml.split(':'); S.act[id]={...(S.act[id]||{}), sel:+i, miss:null}; renderDrawer(); }));
  dr.querySelectorAll('[data-mr]').forEach(b=>b.addEventListener('click',()=>{
    const [id,i]=b.dataset.mr.split(':'); const s=S.act[id]||{}; if(s.sel==null) return;
    if(s.sel===+i){ s.done={...(s.done||{}), [i]:true}; s.sel=null; s.miss=null;
      const a=findAct(item,id); if(Object.keys(s.done).length===a.pairs.length){ s.complete=true; S.progress.acts[id]=true; }
    } else { s.miss=+i; setTimeout(()=>{ const q=S.act[id]||{}; q.miss=null; S.act[id]=q; renderDrawer(); },600); }
    S.act[id]=s; save(); renderDrawer(); }));
  dr.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>{
    const [id,pos,dir]=b.dataset.mv.split(':'); const s=S.act[id]; const o=s.order;
    const np=+pos+ +dir; [o[+pos],o[np]]=[o[np],o[+pos]]; s.checked=false; S.act[id]=s; renderDrawer(); }));
  dr.querySelectorAll('[data-ordcheck]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.ordcheck, s=S.act[id]; s.checked=true;
    if(s.order.every((v,i)=>v===i)) S.progress.acts[id]=true;
    S.act[id]=s; save(); renderDrawer(); }));
  const cc = dr.querySelector('#cc');
  if(cc) cc.addEventListener('click',()=>completeModule(item, day));
}
function findAct(m,id){ return (m.activities||[]).find(a=>a.id===id); }

function completeModule(item, day){
  S.progress.mods[item.id]=true; save();
  const p = learnerProg(), st = states();
  toast('Module completed');
  const next = day.items.find(i=>st.item[i.id]==='current');
  if(next && next.id!==item.id){ S.view=day.id; openItem(next.id, day.id); render(); }
  else { S.view=day.id; closeDrawer(); }
}

/* ===================== QUIZ ===================== */
function quizHTML(cp, day, dayIdx){
  const q = S.quiz, qs = cp.questions||[], cfg = cp.settings||{};
  const prev = cpResult(cp);
  const head = `<div class="dhead">
    <button class="dclose" aria-label="Close checkpoint">${ico.x(16)}</button>
    <div class="dcrumb">Day ${dayIdx} · ${cp.variant==='midday'?'Midday checkpoint':'End-of-day checkpoint'}</div>
    <h2 id="dTitle">${esc(cp.title)}</h2>
    <div class="dmeta"><span>${ico.diamond(13)} ${qs.length} questions</span><span>·</span>
      <span>${cfg.attempts===0?'Unlimited attempts':cfg.attempts+' attempt'+(cfg.attempts>1?'s':'')}</span><span>·</span>
      <span>${cfg.feedbackMode==='immediate'?'Immediate feedback':'Feedback after submission'}</span></div>
  </div>`;

  if(!qs.length) return head+`<div class="dbody"><div class="empty"><b>No questions configured</b>This checkpoint has no questions yet.</div></div>`;

  if(q.submitted){
    const score = qs.filter((x,i)=>q.answers[i]===x.correct).length;
    const pct = Math.round(score/qs.length*100);
    return head + `<div class="dbody"><div class="qres">
      ${cfg.showScore?`<div class="big">${score} / ${qs.length}</div><div class="pct">${pct}%</div>`:`<div class="big">${ico.check(44)}</div>`}
      <p>${cfg.showScore?`You answered ${score} of ${qs.length} questions correctly.`:'Your answers have been recorded.'}
      ${cfg.passingScore==null?'<br><span class="tiny">Passing criteria: TBD. Completion is currently based on submission.</span>':''}</p>
      </div>
      ${q.review?`<div class="qrev">${qs.map((x,i)=>{
        const ok=q.answers[i]===x.correct;
        return `<div class="qrv"><div class="qt"><span style="color:${ok?'var(--ok)':'var(--danger)'}">${ok?ico.check(15):ico.x(14)}</span>${esc(x.prompt)}</div>
          <div class="ans">Your answer: <span class="${ok?'yes':'no'}">${esc(x.options[q.answers[i]]!=null?x.options[q.answers[i]]:'No answer')}</span>
          ${ok?'':`<br>Correct: <span class="yes">${esc(x.options[x.correct])}</span>`}
          <br><span class="tiny">${esc(x.explain||'')}</span></div></div>`;}).join('')}</div>`:''}
      </div>
      <div class="dfoot">
        <button class="btn ghost" id="qrev">${q.review?'Hide answers':'Review answers'}</button>
        <span class="req"></span>
        <button class="btn" id="qdone">Continue</button>
      </div>`;
  }

  const cur = qs[q.idx], answered = q.answers[q.idx]!=null;
  const showFb = cfg.feedbackMode==='immediate' && q.checked;
  return head + `<div class="dbody">
    <div class="qhead"><span class="qn">Question ${q.idx+1} of ${qs.length}</span>
      <span class="bar"><i style="width:${Math.round((q.idx)/qs.length*100)}%"></i></span></div>
    <h3 class="qq">${esc(cur.prompt)}</h3>
    <div class="opts">${cur.options.map((o,i)=>{
      let cls = q.answers[q.idx]===i?'sel':'';
      if(showFb){ if(i===cur.correct) cls='right'; else if(q.answers[q.idx]===i) cls='wrong'; }
      return `<button class="opt ${cls}" data-qo="${i}" ${showFb?'disabled':''}>
        <span class="rd"></span><span style="color:var(--ink)">${esc(o)}</span></button>`;
    }).join('')}</div>
    ${showFb?`<div class="fb ${q.answers[q.idx]===cur.correct?'good':'bad'}">
      <span class="fi">${q.answers[q.idx]===cur.correct?ico.check(16):ico.info(16)}</span>
      <div><b>${q.answers[q.idx]===cur.correct?'Correct':'Not quite'}</b><p>${esc(cur.explain||'')}</p></div></div>`:''}
    </div>
    <div class="dfoot">
      <span class="req">${qs.length-q.idx-1} remaining</span>
      ${showFb || cfg.feedbackMode!=='immediate'
        ? `<button class="btn" id="qnext" ${answered?'':'disabled'}>${q.idx===qs.length-1?'Submit checkpoint':'Next question'}</button>`
        : `<button class="btn" id="qcheck" ${answered?'':'disabled'}>Check answer</button>`}
    </div>`;
}
function bindQuiz(cp){
  const dr = document.getElementById('drawer'), q=S.quiz, qs=cp.questions||[], cfg=cp.settings||{};
  dr.querySelector('.dclose').addEventListener('click', closeDrawer);
  dr.querySelectorAll('[data-qo]').forEach(b=>b.addEventListener('click',()=>{
    q.answers[q.idx]=+b.dataset.qo; renderDrawer(); }));
  const ck = dr.querySelector('#qcheck'); if(ck) ck.addEventListener('click',()=>{ q.checked=true; renderDrawer(); });
  const nx = dr.querySelector('#qnext');
  if(nx) nx.addEventListener('click',()=>{
    if(q.idx===qs.length-1){
      const score = qs.filter((x,i)=>q.answers[i]===x.correct).length;
      S.progress.cps[cp.id]={submitted:true, score, total:qs.length, answers:{...q.answers}};
      q.submitted=true; save(); toast('Checkpoint submitted');
    } else { q.idx++; q.checked=false; }
    renderDrawer();
  });
  const rv = dr.querySelector('#qrev'); if(rv) rv.addEventListener('click',()=>{ q.review=!q.review; renderDrawer(); });
  const dn = dr.querySelector('#qdone'); if(dn) dn.addEventListener('click',()=>{
    const f = findItem(learnerProg(), cp.id); closeDrawer();
    if(f){ S.view=f.day.id; render(); }
  });
}

/* ===================== SEARCH ===================== */
function bindSearch(){
  const inp=document.getElementById('q'), box=document.getElementById('qres');
  const close=()=>box.innerHTML='';
  inp.addEventListener('input',()=>{
    const v=inp.value.trim().toLowerCase(); if(v.length<2) return close();
    const p=learnerProg(), st=states(), hits=[];
    p.days.forEach((d,di)=>d.items.forEach(it=>{
      const hay=[it.title,it.description,it.objective,...(it.concepts||[]),...(it.materials||[]).map(m=>m.title)].join(' ').toLowerCase();
      if(hay.includes(v)) hits.push({it,d,di,st:st.item[it.id]});
    }));
    box.innerHTML = hits.length ? `<div class="sresults">${hits.slice(0,8).map(h=>
      `<button data-hit="${h.it.id}" data-hd="${h.d.id}">${esc(h.it.title)}
        <span class="m">Day ${h.di+1} · ${h.st==='locked'?'Locked':h.st==='done'?'Completed':'Available'}</span></button>`).join('')}</div>`
      : `<div class="sresults"><div class="empty" style="border:none;padding:14px">No matches. Search covers module titles, objectives, concepts and materials.</div></div>`;
    box.querySelectorAll('[data-hit]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.hit, s=states();
      inp.value=''; close();
      if(s.item[id]==='locked'){ S.view=b.dataset.hd; render(); return toast('That module is locked. Complete the previous one to unlock.'); }
      S.view=b.dataset.hd; render(); openItem(id, b.dataset.hd);
    }));
  });
  inp.addEventListener('blur',()=>setTimeout(close,180));
}

function bindTrainer(){
  const $ = s => document.querySelectorAll(s);
  const touch = ()=>{ S.dirty=true; save(); render(); };

  const pv=document.getElementById('tPreview'); if(pv) pv.addEventListener('click',()=>{
    S.preview=true; S.mode='learner'; S.view='overview'; render(); toast('Previewing the draft. Learner progress is untouched.'); });
  const pb=document.getElementById('tPublish'); if(pb) pb.addEventListener('click',()=>{
    S.published = clone(S.draft); S.dirty=false; save(); render(); toast('Changes published'); });
  const rd=document.getElementById('resetDemo'); if(rd) rd.addEventListener('click',()=>{
    confirmModal('Restore demo state?','This resets the program, all edits and all learner progress.',()=>resetAll()); });
  const ad=document.getElementById('addDay'); if(ad) ad.addEventListener('click',()=>{
    S.draft.days.push({id:nid('d'), title:'New day', short:'New day', description:'', items:[]}); touch(); });
  const asu=document.getElementById('addSetup'); if(asu) asu.addEventListener('click',()=>{
    S.draft.setup.items.push({id:nid('s'), label:'New setup item'}); touch(); });

  $('[data-delsetup]').forEach(b=>b.addEventListener('click',()=>{
    S.draft.setup.items = S.draft.setup.items.filter(i=>i.id!==b.dataset.delsetup); touch(); }));
  $('[data-daytitle]').forEach(i=>i.addEventListener('change',()=>{
    const d=findDay(S.draft,i.dataset.daytitle); d.title=i.value; d.short=i.value.split(/[&,]/)[0].trim().slice(0,22); touch(); }));
  $('[data-daymv]').forEach(b=>b.addEventListener('click',()=>{
    const [id,dir]=b.dataset.daymv.split(':'); const a=S.draft.days, i=a.findIndex(d=>d.id===id), j=i+ +dir;
    if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; touch(); }));
  $('[data-daydel]').forEach(b=>b.addEventListener('click',()=>{
    const d=findDay(S.draft,b.dataset.daydel);
    confirmModal('Delete '+d.title+'?', 'Its '+d.items.length+' items will be removed from the draft. Learners keep any progress until you publish.',
      ()=>{ S.draft.days=S.draft.days.filter(x=>x.id!==d.id); touch(); }); }));

  $('[data-mvr]').forEach(b=>b.addEventListener('click',()=>{
    const [id,dir]=b.dataset.mvr.split(':'); const f=findItem(S.draft,id); const a=f.day.items;
    const i=a.indexOf(f.item), j=i+ +dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; touch(); }));
  $('[data-dup]').forEach(b=>b.addEventListener('click',()=>{
    const f=findItem(S.draft,b.dataset.dup); const c=clone(f.item);
    c.id=nid(c.kind==='module'?'m':'cp'); c.title=c.title+' (copy)';
    (c.materials||[]).forEach(m=>m.id=nid('r')); (c.activities||[]).forEach(a=>a.id=nid('a'));
    f.day.items.splice(f.day.items.indexOf(f.item)+1,0,c); touch(); }));
  $('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const f=findItem(S.draft,b.dataset.del);
    confirmModal('Delete "'+f.item.title+'"?','Removed from the draft only. Publish to apply it for learners.',
      ()=>{ f.day.items=f.day.items.filter(x=>x.id!==f.item.id); touch(); }); }));
  $('[data-edit]').forEach(b=>b.addEventListener('click',()=>{ S.editor={id:b.dataset.edit, open:{}}; renderEditor(); }));
  $('[data-addmod]').forEach(b=>b.addEventListener('click',()=>{
    const d=findDay(S.draft,b.dataset.addmod);
    const m={id:nid('m'), kind:'module', required:true, title:'New module', est:null, description:'', objective:'',
             concepts:[], methods:[], materials:[], activities:[]};
    d.items.push(m); S.dirty=true; save(); render(); S.editor={id:m.id, open:{}}; renderEditor(); }));
  $('[data-addcp]').forEach(b=>b.addEventListener('click',()=>{
    const d=findDay(S.draft,b.dataset.addcp);
    const c={id:nid('cp'), kind:'checkpoint', variant:'midday', required:true, title:'New checkpoint', description:'',
             settings:{attempts:1, feedbackMode:'immediate', showScore:true, passingScore:null, requiredToProgress:true}, questions:[]};
    d.items.push(c); S.dirty=true; save(); render(); S.editor={id:c.id, open:{}}; renderEditor(); }));

  /* drag and drop */
  let drag=null;
  $('.trow[draggable]').forEach(r=>{
    r.addEventListener('dragstart',e=>{ drag=r.dataset.row; r.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    r.addEventListener('dragend',()=>{ r.classList.remove('dragging'); document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); });
    r.addEventListener('dragover',e=>{ e.preventDefault(); if(r.dataset.row!==drag) r.classList.add('over'); });
    r.addEventListener('dragleave',()=>r.classList.remove('over'));
    r.addEventListener('drop',e=>{ e.preventDefault(); r.classList.remove('over');
      if(!drag||r.dataset.row===drag) return;
      moveItem(drag, r.dataset.rowday, r.dataset.row); });
  });
  $('[data-drop]').forEach(z=>{
    z.addEventListener('dragover',e=>e.preventDefault());
    z.addEventListener('drop',e=>{ if(e.target.closest('.trow')) return; e.preventDefault(); if(drag) moveItem(drag, z.dataset.drop, null); });
  });
  function moveItem(itemId, toDayId, beforeId){
    const f=findItem(S.draft,itemId); if(!f) return;
    f.day.items = f.day.items.filter(x=>x.id!==itemId);
    const d = findDay(S.draft,toDayId);
    const idx = beforeId ? d.items.findIndex(x=>x.id===beforeId) : d.items.length;
    d.items.splice(idx<0?d.items.length:idx, 0, f.item);
    S.dirty=true; save(); render(); toast('Moved. Progression re-derived from the new order.');
  }
}

/* ---------- modal helpers ---------- */
function closeModal(){ document.getElementById('modal').classList.remove('on'); S.editor=null; }
function confirmModal(title,body,onYes){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="msheet" style="max-width:460px"><div class="mh"><h3>${esc(title)}</h3></div>
    <div class="mb"><p class="muted" style="margin:0">${esc(body)}</p></div>
    <div class="mf"><button class="btn ghost" id="cNo">Cancel</button><button class="btn danger" id="cYes">Delete</button></div></div>`;
  m.classList.add('on');
  m.querySelector('#cNo').addEventListener('click',()=>m.classList.remove('on'));
  m.querySelector('#cYes').addEventListener('click',()=>{ m.classList.remove('on'); onYes(); });
}
