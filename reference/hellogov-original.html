    <div class="mb">${it.kind==='module'?modEditor(it,f.day):cpEditor(it)}</div>
    <div class="mf">
      ${it.kind==='module'?'<button class="btn ghost" id="ePreview">Preview learner lesson</button>':''}
      <button class="btn" id="eDone">Done</button></div>
  </div>`;
  m.classList.add('on');
  bindEditor(it, f.day);
}
function modEditor(m, day){
  const dayOpts = S.draft.days.map((d,i)=>`<option value="${d.id}" ${d.id===day.id?'selected':''}>Day ${i+1} — ${esc(d.title)}</option>`).join('');
  return `
  <div class="fgrp"><label for="eTitle">Title</label><input type="text" id="eTitle" value="${esc(m.title)}"></div>
  <div class="fgrp"><label for="eDesc">Short description (shown in the learning path)</label><textarea id="eDesc" style="min-height:56px">${esc(m.description||'')}</textarea></div>
  <div class="fgrp"><label for="eObj">Learning objective (shown as "What you'll learn")</label><textarea id="eObj">${esc(m.objective||'')}</textarea></div>
  <div class="f2">
    <div class="fgrp"><label for="eEst">Estimated minutes</label>
      <input type="number" id="eEst" min="0" step="5" value="${m.est==null?'':m.est}" placeholder="Leave blank for Time TBD">
      <div class="hint">Blank shows "Time TBD". Estimates always render with a tilde.</div></div>
    <div class="fgrp"><label for="eDay">Day</label><select id="eDay">${dayOpts}</select>
      <div class="hint">Moving a module re-derives progression automatically.</div></div>
  </div>
  <div class="f2">
    <div class="fgrp"><label for="eReq">Required for progression</label>
      <select id="eReq"><option value="1" ${m.required!==false?'selected':''}>Required</option><option value="0" ${m.required===false?'selected':''}>Optional</option></select></div>
    <div class="fgrp"><label for="eNote">Delivery note (optional)</label><input type="text" id="eNote" value="${esc(m.note||'')}"></div>
  </div>

  <div class="msec"><h4>Key concepts</h4>
    <div class="chiprow">${(m.concepts||[]).map((c,i)=>`<span class="chip">${esc(c)}<button data-rmc="${i}" aria-label="Remove">${ico.x(12)}</button></span>`).join('')||'<span class="tiny">None yet</span>'}</div>
    <div style="display:flex;gap:8px"><input type="text" id="eConcept" placeholder="Add a concept" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px">
      <button class="btn sm ghost" id="eAddC">Add</button></div>
  </div>

  <div class="msec"><h4>Suggested learning methods</h4>
    <div class="chiprow">${(m.methods||[]).map((c,i)=>`<span class="chip">${esc(c)}<button data-rmm="${i}" aria-label="Remove">${ico.x(12)}</button></span>`).join('')||'<span class="tiny">None yet</span>'}</div>
    <div style="display:flex;gap:8px"><select id="eMethod" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px">
      ${METHODS.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn sm ghost" id="eAddM">Add</button></div>
  </div>

  <div class="msec"><h4>Materials <button class="btn sm ghost" id="eAddMat">${ico.plus(13)} Add</button></h4>
    ${(m.materials||[]).map((r,i)=>`
      <div class="minirow"><span class="grip" style="color:var(--ink-3)">${matIcon(r.type)}</span>
        <span class="mt"><span class="mn">${esc(r.title)} ${reqPill(r.requirement)} ${r.sample?'<span class="pill sample">Demo</span>':''} ${r.pending?'<span class="pill tbd">In preparation</span>':''}</span>
        <span class="ms">${esc(r.note||r.url||'')}</span></span>
        <button class="iconbtn" data-mvmat="${i}:-1" ${i===0?'disabled':''} aria-label="Up">${ico.up(13)}</button>
        <button class="iconbtn" data-mvmat="${i}:1" ${i===(m.materials.length-1)?'disabled':''} aria-label="Down">${ico.down(13)}</button>
        <button class="iconbtn" data-emat="${i}" aria-label="Edit">${ico.pen(13)}</button>
        <button class="iconbtn dg" data-dmat="${i}" aria-label="Remove">${ico.trash(13)}</button></div>
      ${S.editor.open.mat===i?matForm(r,i):''}`).join('') || '<p class="tiny">No materials configured.</p>'}
  </div>

  <div class="msec"><h4>Practice & activities <button class="btn sm ghost" id="eAddAct">${ico.plus(13)} Add</button></h4>
    ${(m.activities||[]).map((a,i)=>`
      <div class="minirow"><span class="grip" style="color:var(--ink-3)">${ico.target(15)}</span>
        <span class="mt"><span class="mn">${esc(a.title)} ${reqPill(a.requirement)} <span class="pill">${esc((ACT_TYPES.find(t=>t[0]===a.type)||[,a.type])[1])}</span></span>
        <span class="ms">${esc((a.instructions||'').slice(0,70))}</span></span>
        <button class="iconbtn" data-mvact="${i}:-1" ${i===0?'disabled':''} aria-label="Up">${ico.up(13)}</button>
        <button class="iconbtn" data-mvact="${i}:1" ${i===(m.activities.length-1)?'disabled':''} aria-label="Down">${ico.down(13)}</button>
        <button class="iconbtn" data-eact="${i}" aria-label="Edit">${ico.pen(13)}</button>
        <button class="iconbtn dg" data-dact="${i}" aria-label="Remove">${ico.trash(13)}</button></div>
      ${S.editor.open.act===i?actForm(a,i):''}`).join('') || '<p class="tiny">No activities configured. The learner sees a "Practice activity in development" state.</p>'}
  </div>`;
}
function matForm(r,i){
  return `<div style="border:1px solid var(--brand);border-radius:11px;padding:14px;margin:-3px 0 10px">
    <div class="f2">
      <div class="fgrp"><label>Title</label><input type="text" data-mf="title" value="${esc(r.title)}"></div>
      <div class="fgrp"><label>Type</label><select data-mf="type">${MAT_TYPES.map(t=>`<option value="${t[0]}" ${r.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div>
    </div>
    <div class="f2">
      <div class="fgrp"><label>Requirement</label><select data-mf="requirement">
        ${['required','optional','reference'].map(x=>`<option value="${x}" ${r.requirement===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div>
      <div class="fgrp"><label>Status</label><select data-mf="pending">
        <option value="" ${!r.pending?'selected':''}>Available</option><option value="1" ${r.pending?'selected':''}>In preparation</option></select></div>
    </div>
    <div class="fgrp"><label>Note</label><input type="text" data-mf="note" value="${esc(r.note||'')}"></div>
    <div class="fgrp"><label>URL (for links)</label><input type="text" data-mf="url" value="${esc(r.url||'')}"></div>
    <button class="btn sm" data-matsave="${i}">Save material</button>
  </div>`;
}
function actForm(a,i){
  const hasOpts = ['mcq','scenario','compare','account','callreview'].includes(a.type);
  return `<div style="border:1px solid var(--brand);border-radius:11px;padding:14px;margin:-3px 0 10px">
    <div class="f2">
      <div class="fgrp"><label>Title</label><input type="text" data-af="title" value="${esc(a.title)}"></div>
      <div class="fgrp"><label>Type</label><select data-af="type">${ACT_TYPES.map(t=>`<option value="${t[0]}" ${a.type===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div>
    </div>
    <div class="fgrp"><label>Requirement</label><select data-af="requirement">
      ${['required','optional','reference'].map(x=>`<option value="${x}" ${a.requirement===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div>
    <div class="fgrp"><label>Instructions</label><textarea data-af="instructions" style="min-height:56px">${esc(a.instructions||'')}</textarea></div>
    <div class="fgrp"><label>Scenario (optional)</label><textarea data-af="scenario" style="min-height:56px">${esc(a.scenario||'')}</textarea></div>
    ${hasOpts?`
      <div class="fgrp"><label>Answer options (one per line)</label><textarea data-af="options">${esc((a.options||[]).join('\n'))}</textarea></div>
      <div class="f2">
        <div class="fgrp"><label>Correct option number</label><input type="number" data-af="correct" min="1" value="${(a.correct==null?1:a.correct+1)}"></div>
        <div class="fgrp"><label>&nbsp;</label><div class="hint">Counting from 1, top to bottom.</div></div>
      </div>
      <div class="fgrp"><label>Explanation shown after answering</label><textarea data-af="explain">${esc(a.explain||'')}</textarea></div>`:''}
    ${a.type==='written'?`<div class="fgrp"><label>Model answer</label><textarea data-af="model">${esc(a.model||'')}</textarea></div>`:''}
    ${a.type==='order'?`<div class="fgrp"><label>Steps in correct order (one per line)</label><textarea data-af="steps">${esc((a.steps||[]).join('\n'))}</textarea></div>`:''}
    ${a.type==='roleplay'?`<div class="fgrp"><label>Agent goal</label><textarea data-af="goal" style="min-height:56px">${esc(a.goal||'')}</textarea></div>
      <div class="fgrp"><label>Skills (one per line)</label><textarea data-af="skills">${esc((a.skills||[]).join('\n'))}</textarea></div>`:''}
    ${a.type==='shadow'?`<div class="fgrp"><label>Observation checklist (one per line)</label><textarea data-af="checklist">${esc((a.checklist||[]).join('\n'))}</textarea></div>`:''}
    <button class="btn sm" data-actsave="${i}">Save activity</button>
  </div>`;
}
function cpEditor(c){
  const s=c.settings;
  return `
  <div class="fgrp"><label for="eTitle">Title</label><input type="text" id="eTitle" value="${esc(c.title)}"></div>
  <div class="fgrp"><label for="eDesc">Description</label><textarea id="eDesc" style="min-height:56px">${esc(c.description||'')}</textarea></div>
  <div class="f2">
    <div class="fgrp"><label for="eVar">Position label</label><select id="eVar">
      <option value="midday" ${c.variant==='midday'?'selected':''}>Midday checkpoint</option>
      <option value="eod" ${c.variant==='eod'?'selected':''}>End-of-day checkpoint</option></select>
      <div class="hint">Where it actually sits is set by its position in the day.</div></div>
    <div class="fgrp"><label for="eAtt">Attempts</label><select id="eAtt">
      <option value="1" ${s.attempts===1?'selected':''}>1 attempt</option>
      <option value="3" ${s.attempts===3?'selected':''}>3 attempts</option>
      <option value="0" ${s.attempts===0?'selected':''}>Unlimited</option></select></div>
  </div>
  <div class="f2">
    <div class="fgrp"><label for="eFb">Feedback</label><select id="eFb">
      <option value="immediate" ${s.feedbackMode==='immediate'?'selected':''}>Immediate</option>
      <option value="end" ${s.feedbackMode==='end'?'selected':''}>After submission</option></select></div>
    <div class="fgrp"><label for="eScore">Score visibility</label><select id="eScore">
      <option value="1" ${s.showScore?'selected':''}>Visible</option><option value="0" ${!s.showScore?'selected':''}>Hidden</option></select></div>
  </div>
  <div class="f2">
    <div class="fgrp"><label for="ePass">Passing score (%)</label>
      <input type="number" id="ePass" min="0" max="100" value="${s.passingScore==null?'':s.passingScore}" placeholder="Blank = TBD">
      <div class="hint">Left blank, completion is based on submission and the learner is told the criteria are TBD.</div></div>
    <div class="fgrp"><label for="ePReq">Required to progress</label><select id="ePReq">
      <option value="1" ${s.requiredToProgress?'selected':''}>Yes</option><option value="0" ${!s.requiredToProgress?'selected':''}>No</option></select></div>
  </div>
  <div class="msec"><h4>Questions <button class="btn sm ghost" id="eAddQ">${ico.plus(13)} Add question</button></h4>
    ${(c.questions||[]).map((q,i)=>`
      <div class="minirow"><span class="grip" style="color:var(--ink-3)">${i+1}</span>
        <span class="mt"><span class="mn">${esc(q.prompt.slice(0,64))}${q.prompt.length>64?'…':''}</span>
        <span class="ms">${(q.options||[]).length} options · correct: ${esc((q.options||[])[q.correct]||'—').slice(0,34)}</span></span>
        <button class="iconbtn" data-mvq="${i}:-1" ${i===0?'disabled':''} aria-label="Up">${ico.up(13)}</button>
        <button class="iconbtn" data-mvq="${i}:1" ${i===c.questions.length-1?'disabled':''} aria-label="Down">${ico.down(13)}</button>
        <button class="iconbtn" data-eq="${i}" aria-label="Edit">${ico.pen(13)}</button>
        <button class="iconbtn dg" data-dq="${i}" aria-label="Remove">${ico.trash(13)}</button></div>
      ${S.editor.open.q===i?`<div style="border:1px solid var(--brand);border-radius:11px;padding:14px;margin:-3px 0 10px">
        <div class="fgrp"><label>Question</label><textarea data-qf="prompt" style="min-height:56px">${esc(q.prompt)}</textarea></div>
        <div class="fgrp"><label>Options (one per line)</label><textarea data-qf="options">${esc((q.options||[]).join('\n'))}</textarea></div>
        <div class="f2"><div class="fgrp"><label>Correct option number</label><input type="number" data-qf="correct" min="1" value="${q.correct+1}"></div>
        <div class="fgrp"><label>&nbsp;</label><div class="hint">Counting from 1.</div></div></div>
        <div class="fgrp"><label>Explanation</label><textarea data-qf="explain">${esc(q.explain||'')}</textarea></div>
        <button class="btn sm" data-qsave="${i}">Save question</button></div>`:''}`).join('') || '<p class="tiny">No questions yet.</p>'}
  </div>`;
}
function bindEditor(it, day){
  const m=document.getElementById('modal'), $=s=>m.querySelectorAll(s), $1=s=>m.querySelector(s);
  const upd = ()=>{ S.dirty=true; save(); renderEditor(); render(); };
  const val = id => { const e=$1(id); return e?e.value:''; };

  $1('#eClose').addEventListener('click', closeModal);
  $1('#eDone').addEventListener('click',()=>{ commit(); closeModal(); render(); });
  const pv=$1('#ePreview'); if(pv) pv.addEventListener('click',()=>{
    commit(); closeModal(); S.preview=true; S.mode='learner'; S.view=day.id; render(); openItem(it.id, day.id); });

  function commit(){
    if(it.kind==='module'){
      it.title = val('#eTitle')||it.title;
      it.description = val('#eDesc'); it.objective = val('#eObj'); it.note = val('#eNote')||undefined;
      const e = val('#eEst'); it.est = e===''?null:+e; delete it.estMin; delete it.estMax;
      it.required = val('#eReq')==='1';
      const tgt = val('#eDay');
      if(tgt && tgt!==day.id){
        day.items = day.items.filter(x=>x.id!==it.id);
        findDay(S.draft,tgt).items.push(it);
      }
    } else {
      it.title = val('#eTitle')||it.title; it.description = val('#eDesc'); it.variant = val('#eVar');
      const p = val('#ePass');
      it.settings = {attempts:+val('#eAtt'), feedbackMode:val('#eFb'), showScore:val('#eScore')==='1',
                     passingScore: p===''?null:+p, requiredToProgress: val('#ePReq')==='1'};
    }
    S.dirty=true; save();
  }

  const ac=$1('#eAddC'); if(ac) ac.addEventListener('click',()=>{
    const v=$1('#eConcept').value.trim(); if(!v) return; commit(); it.concepts=[...(it.concepts||[]),v]; upd(); });
  const am=$1('#eAddM'); if(am) am.addEventListener('click',()=>{
    commit(); it.methods=[...(it.methods||[]), $1('#eMethod').value]; upd(); });
  $('[data-rmc]').forEach(b=>b.addEventListener('click',()=>{ commit(); it.concepts.splice(+b.dataset.rmc,1); upd(); }));
  $('[data-rmm]').forEach(b=>b.addEventListener('click',()=>{ commit(); it.methods.splice(+b.dataset.rmm,1); upd(); }));

  const amat=$1('#eAddMat'); if(amat) amat.addEventListener('click',()=>{
    commit(); it.materials=[...(it.materials||[]), {id:nid('r'), type:'doc', title:'New material', requirement:'required', note:'', sample:true}];
    S.editor.open={mat:it.materials.length-1}; upd(); });
  $('[data-emat]').forEach(b=>b.addEventListener('click',()=>{
    commit(); S.editor.open = S.editor.open.mat===+b.dataset.emat?{}:{mat:+b.dataset.emat}; renderEditor(); }));
  $('[data-dmat]').forEach(b=>b.addEventListener('click',()=>{ commit(); it.materials.splice(+b.dataset.dmat,1); S.editor.open={}; upd(); }));
  $('[data-mvmat]').forEach(b=>b.addEventListener('click',()=>{
    const [i,d]=b.dataset.mvmat.split(':').map(Number); const a=it.materials; const j=i+d;
    if(j<0||j>=a.length) return; commit(); [a[i],a[j]]=[a[j],a[i]]; S.editor.open={}; upd(); }));
  $('[data-matsave]').forEach(b=>b.addEventListener('click',()=>{
    const r = it.materials[+b.dataset.matsave];
    m.querySelectorAll('[data-mf]').forEach(f=>{
      const k=f.dataset.mf; if(k==='pending') r.pending = f.value==='1'||undefined; else r[k]=f.value; });
    commit(); S.editor.open={}; upd(); toast('Material saved'); }));

  const aact=$1('#eAddAct'); if(aact) aact.addEventListener('click',()=>{
    commit(); it.activities=[...(it.activities||[]),
      {id:nid('a'), type:'mcq', title:'New activity', requirement:'required', instructions:'', options:['Option A','Option B'], correct:0, explain:'', sample:true}];
    S.editor.open={act:it.activities.length-1}; upd(); });
  $('[data-eact]').forEach(b=>b.addEventListener('click',()=>{
    commit(); S.editor.open = S.editor.open.act===+b.dataset.eact?{}:{act:+b.dataset.eact}; renderEditor(); }));
  $('[data-dact]').forEach(b=>b.addEventListener('click',()=>{ commit(); it.activities.splice(+b.dataset.dact,1); S.editor.open={}; upd(); }));
  $('[data-mvact]').forEach(b=>b.addEventListener('click',()=>{
    const [i,d]=b.dataset.mvact.split(':').map(Number); const a=it.activities; const j=i+d;
    if(j<0||j>=a.length) return; commit(); [a[i],a[j]]=[a[j],a[i]]; S.editor.open={}; upd(); }));
  $('[data-actsave]').forEach(b=>b.addEventListener('click',()=>{
    const a = it.activities[+b.dataset.actsave];
    m.querySelectorAll('[data-af]').forEach(f=>{
      const k=f.dataset.af;
      if(['options','steps','skills','checklist'].includes(k)) a[k]=f.value.split('\n').map(s=>s.trim()).filter(Boolean);
      else if(k==='correct') a.correct = Math.max(0,(+f.value||1)-1);
      else a[k]=f.value;
    });
    commit(); S.editor.open={}; upd(); toast('Activity saved'); }));

  const aq=$1('#eAddQ'); if(aq) aq.addEventListener('click',()=>{
    commit(); it.questions=[...(it.questions||[]), {id:nid('q'), prompt:'New question', options:['Option A','Option B'], correct:0, explain:''}];
    S.editor.open={q:it.questions.length-1}; upd(); });
  $('[data-eq]').forEach(b=>b.addEventListener('click',()=>{
    commit(); S.editor.open = S.editor.open.q===+b.dataset.eq?{}:{q:+b.dataset.eq}; renderEditor(); }));
  $('[data-dq]').forEach(b=>b.addEventListener('click',()=>{ commit(); it.questions.splice(+b.dataset.dq,1); S.editor.open={}; upd(); }));
  $('[data-mvq]').forEach(b=>b.addEventListener('click',()=>{
    const [i,d]=b.dataset.mvq.split(':').map(Number); const a=it.questions; const j=i+d;
    if(j<0||j>=a.length) return; commit(); [a[i],a[j]]=[a[j],a[i]]; S.editor.open={}; upd(); }));
  $('[data-qsave]').forEach(b=>b.addEventListener('click',()=>{
    const q = it.questions[+b.dataset.qsave];
    m.querySelectorAll('[data-qf]').forEach(f=>{
      const k=f.dataset.qf;
      if(k==='options') q.options=f.value.split('\n').map(s=>s.trim()).filter(Boolean);
      else if(k==='correct') q.correct=Math.max(0,(+f.value||1)-1);
      else q[k]=f.value; });
    commit(); S.editor.open={}; upd(); toast('Question saved'); }));
}

/* ===================== RENDER ===================== */
function render(){
  document.getElementById('mLearner').setAttribute('aria-pressed', S.mode==='learner');
  document.getElementById('mTrainer').setAttribute('aria-pressed', S.mode==='trainer');
  const main = document.getElementById('main');
  if(S.mode==='trainer'){
    document.getElementById('nav').innerHTML = `<button class="navitem" aria-current="true"><span class="ico">${ico.sort()}</span>Program structure</button>`;
    main.innerHTML = viewTrainer(); bindTrainer(); return;
  }
  renderNav();
  const banner = S.preview ? `<div class="pvbanner"><span>${ico.eye(16)}</span>
    <span class="tb">Previewing the draft. Locks are lifted and learner progress is not affected.</span>
    <button class="btn sm ghost" id="exitPv" style="border-color:currentColor;color:inherit">Exit preview</button></div>` : '';
  const v = S.view;
  const body = v==='overview'?viewOverview() : v==='setup'?viewSetup() : v==='cert'?viewCert()
    : (findDay(learnerProg(),v) ? viewDay(v) : viewOverview());
  main.innerHTML = banner + body;

  main.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.go, st=states();
    if(id==='cert' && !st.certUnlocked) return toast('Complete Days 1 to 4 to unlock certification');
    if(id!=='cert' && findDay(learnerProg(),id) && st.day[id]==='locked') return toast('Complete the previous day to unlock');
    S.view=id; render(); window.scrollTo({top:0,behavior:'instant'});
  }));
  main.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openItem(b.dataset.open, b.dataset.day)));
  main.querySelectorAll('[data-setup]').forEach(c=>c.addEventListener('change',()=>{
    S.progress.setup[c.dataset.setup]=c.checked; save(); render(); }));
  const ex=document.getElementById('exitPv'); if(ex) ex.addEventListener('click',()=>{
    S.preview=false; S.mode='trainer'; render(); });
  if(S.drawer) renderDrawer();
}

/* ===================== BOOT ===================== */
document.getElementById('mLearner').addEventListener('click',()=>{ S.mode='learner'; S.preview=false; S.view='overview'; render(); });
document.getElementById('mTrainer').addEventListener('click',()=>{ S.mode='trainer'; S.preview=false; closeDrawer(); render(); });
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){
  const m=document.getElementById('modal'); if(m.classList.contains('on')) return m.classList.remove('on');
  if(S.drawer) closeDrawer(); }});
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') e.currentTarget.classList.remove('on'); });

load(); bindSearch(); render();
</script>
</body>
</html>
